; Heltec WiFi LoRa 32 V4.3 (no OLED) sensor bench test.
; Two SHT40 on separate buses + one thermistor. Serial output only.
; Does NOT send anything to the Waveshare.

[env:heltec-sensor-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -I../../common
