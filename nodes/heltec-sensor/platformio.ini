; AeroSentry sensor node — Heltec WiFi LoRa 32 V4.3, no OLED.
; Two SHT40 probes on separate buses, the chamber thermistor, and the
; vent pressure module. Sends SensorPacket version 3 on ESP-NOW channel 1.

[env:heltec-v4-sensor]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -I../../common

lib_deps =
    bogde/HX711 @ ^0.7.5
