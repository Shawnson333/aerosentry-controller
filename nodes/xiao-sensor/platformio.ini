; AeroSentry sensor node — Seeed XIAO ESP32-C3
; Sends two SHT31 readings and one chamber thermistor sample by ESP-NOW.

[env:xiao-esp32-c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wl,-u,_printf_float
    -Iinclude
    -I../../common
