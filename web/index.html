<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AeroSentry</title>
  <style>
    :root { color-scheme: dark; --bg: #0a1628; --card: #12233d; --text: #fff; --muted: #9fb0c7; --accent: #00ff88; --warn: #ff4444; --line: #243956; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.45 "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { margin: 0; font-size: 28px; }
    nav { display: flex; gap: 16px; margin: 8px 0 16px; }
    a { color: var(--accent); }
    .banner, .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .banner { color: var(--muted); }
    .ok { color: var(--accent); }
    .bad { color: var(--warn); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    button { min-height: 52px; border: 0; border-radius: 10px; font: inherit; color: #0a1628; background: var(--accent); }
    .stop { background: var(--warn); color: white; grid-column: 1 / -1; }
    button:disabled { opacity: 0.4; }
    label { display: block; margin-top: 12px; color: var(--muted); }
    select { width: 100%; min-height: 40px; margin-top: 4px; }
    dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>AeroSentry</h1>
    <nav><a href="index.html">Controls</a><a href="history.html">History</a></nav>
    <p id="banner" class="banner">Looking for the local bridge.</p>
    <h2>Status</h2>
    <div class="card">
      <dl>
        <dt>Mode</dt><dd id="mode">—</dd>
        <dt>To-Engine</dt><dd id="to">—</dd>
        <dt>From-Engine</dt><dd id="from">—</dd>
        <dt>Chamber</dt><dd id="chamber">—</dd>
        <dt>Chip</dt><dd id="chip">—</dd>
        <dt>Outputs</dt><dd id="outputs">—</dd>
        <dt>Last reply</dt><dd id="reply">—</dd>
      </dl>
    </div>
    <div class="grid">
      <button type="button" data-command="purge" disabled>Purge</button>
      <button type="button" data-command="manual" disabled>Manual dryer</button>
      <button type="button" data-command="auto" disabled>Auto dryer</button>
      <button type="button" data-command="recharge" disabled>Recharge</button>
      <button type="button" class="stop" data-command="stop" disabled>Stop</button>
    </div>
    <label>Manual dryer on time
      <select id="onMin"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
    </label>
    <label>Manual dryer rest, hours
      <select id="offHr"><option selected>1</option><option>2</option><option>3</option></select>
    </label>
    <label>Auto target, From-Engine %
      <select id="target"><option>15</option><option selected>20</option><option>25</option><option>30</option></select>
    </label>
  </main>
  <script>
    const banner = document.getElementById("banner");
    const buttons = document.querySelectorAll("button");
    function showValue(id, valid, value, suffix) {
      const el = document.getElementById(id);
      el.textContent = valid && value != null ? value + suffix : "offline";
    }
    function render(s) {
      document.getElementById("mode").textContent = s.mode || "—";
      showValue("to", s.toValid, s.toRh, "%");
      showValue("from", s.fromValid, s.fromRh, "%");
      showValue("chamber", s.chamberValid, s.chamberF, " F");
      document.getElementById("chip").textContent = s.chipC == null ? "—" : s.chipC + " C";
      const relay = s.relays ? "relay board ready" : "relay board not connected";
      document.getElementById("outputs").textContent =
        "Pump " + (s.pump ? "on" : "off") + ", heater " + (s.heat ? "on" : "off") +
        ", fan " + (s.fan ? "on" : "off") + ". " + relay;
      const reply = document.getElementById("reply");
      reply.textContent = s.lastReply || "—";
      reply.className = s.accepted === true ? "ok" : s.accepted === false ? "bad" : "";
      buttons.forEach(button => button.disabled = !s.connected);
      if (!s.connected) {
        banner.textContent = "Bridge is open, but the Heltec radio is not reporting yet.";
      } else if (!s.relays) {
        banner.textContent = "Live link. Humidity stays offline until the XIAO is in range. Starts are refused while the relay board is at home.";
      } else {
        banner.textContent = "Live link to the controller.";
      }
    }
    async function refresh() {
      try {
        const response = await fetch("/api/status");
        if (!response.ok) throw new Error("status");
        render(await response.json());
      } catch (error) {
        banner.textContent = "Open http://127.0.0.1:8080 from the local bridge. The file itself cannot reach the radios.";
        buttons.forEach(button => button.disabled = true);
      }
    }
    buttons.forEach(button => button.addEventListener("click", async () => {
      buttons.forEach(item => item.disabled = true);
      const response = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          command: button.dataset.command,
          dryerOnMinutes: Number(document.getElementById("onMin").value),
          dryerOffHours: Number(document.getElementById("offHr").value),
          dryerTargetRH: Number(document.getElementById("target").value)
        })
      });
      const ack = await response.json();
      document.getElementById("reply").textContent = ack.text || "No reply.";
      document.getElementById("reply").className = ack.accepted ? "ok" : "bad";
      refresh();
    }));
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
