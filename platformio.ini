; AeroSentry Controller — PlatformIO project config
; Target: Waveshare ESP32-S3 4.3-inch Type B (800x480, LVGL 8.3)

[env:waveshare-esp32-s3-touch-lcd-43]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Use 16MB flash + PSRAM for LVGL
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -Wl,-u,_printf_float
    -Iinclude

lib_deps =
    lvgl/lvgl @ 8.3.11